name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain
        shell: bash
        run: |
          gcc --version
          go env CGO_ENABLED
          go version

      - name: Download modules
        run: go mod download

      - name: Build GUI executable (no console window)
        shell: bash
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-H=windowsgui -s -w" -o texgen.exe .

      - name: Smoke test (help output via -h)
        shell: bash
        run: ./texgen.exe cube -h

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: texgen.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
